services:
  openshelf:
    build: .
    container_name: openshelf
    # Or use a released image instead of building (amd64 + arm64):
    # image: ghcr.io/y0sh4/openshelf:latest
    ports:
      - "3000:3000"
    volumes:
      # Database, sessions and cover cache
      - openshelf-data:/data
      # Your books. Change the left side to your folder, e.g. /mnt/hdd/ebooks:/books:ro
      # More folders: mount them inside /books, e.g. ~/Comics:/books/comics:ro
      - ${BOOKS_PATH:-./books}:/books:ro
    # environment:
    #   # Your own code for creating the first account (at least 8 letters or
    #   # digits). Without it, a random code is printed in `docker logs openshelf`.
    #   OPENSHELF_SETUP_CODE: "choose-a-code"
    #   # Behind an HTTPS reverse proxy (Caddy, Nginx, Traefik):
    #   OPENSHELF_SECURE_COOKIE: "true"
    #   OPENSHELF_TRUST_PROXY: "true"
    #   # Translate selected text with the libretranslate service below
    #   OPENSHELF_TRANSLATE_URL: "http://libretranslate:5000"
    restart: unless-stopped

  # Optional: translate selected text inside the reader, on your own server.
  # Uncomment, set OPENSHELF_TRANSLATE_URL above, and pick the languages you
  # need (each language pair adds memory and disk use).
  # libretranslate:
  #   image: libretranslate/libretranslate:latest
  #   container_name: libretranslate
  #   environment:
  #     LT_LOAD_ONLY: "en,id"
  #   volumes:
  #     - libretranslate-models:/home/libretranslate/.local
  #   restart: unless-stopped

volumes:
  openshelf-data:
  # libretranslate-models:
