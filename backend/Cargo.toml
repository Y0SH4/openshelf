[package]
name = "openshelf"
version = "0.1.0"
edition = "2024"

[dependencies]
# Sign-in: password hashing
argon2 = "0.5"
# Randomness (OsRng) for password salts and session tokens.
# The "getrandom" feature is required; argon2 doesn't enable it by default.
rand_core = { version = "0.6", features = ["getrandom"] }
# SHA-256 of session tokens stored in the database
sha2 = "0.10"
axum = "0.8.9"
epub = "2.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.2", features = ["full"] }
# Stream book files to the browser
tokio-util = { version = "0.7", features = ["io"] }
# Also serves frontend/dist (fs) with cache headers (set-header)
tower-http = { version = "0.7.1", features = ["cors", "fs", "set-header"] }
